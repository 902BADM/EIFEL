<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #172033; background: #eef2f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .login-card { width: min(100%, 420px); padding: 40px; background: #fff; border-radius: 16px; box-shadow: 0 12px 35px rgba(23, 32, 51, .12); }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 28px; color: #667085; }
    .field { display: block; margin-bottom: 18px; font-weight: 600; }
    .field input { width: 100%; margin-top: 8px; padding: 13px 14px; border: 1px solid #d0d5dd; border-radius: 8px; font-size: 16px; outline: none; }
    .field input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, .15); }
    .options { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 24px; font-size: 14px; }
    .remember { display: flex; gap: 8px; align-items: center; font-weight: 400; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { width: 100%; padding: 14px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .message { min-height: 20px; margin-top: 16px; text-align: center; color: #b42318; font-size: 14px; }
  </style>
</head>
<body>
  <main class="login-card">
    <h1>Bienvenido</h1>
    <p class="subtitle">Inicia sesión para continuar</p>
    <form id="loginForm" novalidate>
      <label class="field" for="email">Correo electrónico
        <input id="email" name="email" type="email" autocomplete="username" required placeholder="usuario@ejemplo.com">
      </label>
      <label class="field" for="password">Contraseña
        <input id="password" name="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••">
      </label>
      <div class="options">
        <label class="remember"><input type="checkbox" name="remember"> Recordarme</label>
        <a href="#" aria-label="Recuperar contraseña">¿Olvidaste tu contraseña?</a>
      </div>
      <button type="submit">Iniciar sesión</button>
      <p id="message" class="message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const email = document.getElementById('email');
      const password = document.getElementById('password');
      const message = document.getElementById('message');
      if (!this.checkValidity()) {
        message.textContent = 'Introduce un correo válido y una contraseña de al menos 6 caracteres.';
        return;
      }
      message.style.color = '#067647';
      message.textContent = 'Datos válidos. Conecta este formulario con tu servicio de autenticación.';
    });
  </script>
</body>
</html>
